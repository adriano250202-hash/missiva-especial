<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Uma Epístola Solene</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #241c18 0%, #0d0907 100%);
            font-family: 'Georgia', 'Times New Roman', serif;
            color: #2c241b;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
            transition: background 1.5s ease;
        }

        /* Fundo Rosado/Vinho Elegante ao Aceitar */
        body.theme-romantic {
            background: radial-gradient(circle at center, #3d1c24 0%, #17070b 100%);
        }

        /* Partículas sutis (Peiras de Ouro/Estrelas) */
        .sparkle {
            position: absolute;
            width: 3px;
            height: 3px;
            background-color: rgba(220, 190, 140, 0.5);
            border-radius: 50%;
            pointer-events: none;
            animation: float 7s infinite ease-in-out;
            box-shadow: 0 0 6px rgba(220, 190, 140, 0.7);
            z-index: 1;
        }

        @keyframes float {
            0% { transform: translateY(0) scale(0.8); opacity: 0; }
            50% { opacity: 0.7; transform: translateY(-50px) scale(1.2); }
            100% { transform: translateY(-100px) scale(0.8); opacity: 0; }
        }

        .main-wrapper {
            position: relative;
            width: 100%;
            max-width: 580px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }

        /* Áster Interativa (Início) */
        .aster-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: opacity 1s ease, transform 1s ease;
        }

        .aster-flower {
            width: 130px;
            height: 130px;
            position: relative;
            animation: pulseAster 3s infinite ease-in-out;
            filter: drop-shadow(0 8px 20px rgba(0,0,0,0.7));
        }

        @keyframes pulseAster {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.06) rotate(4deg); }
        }

        .petals-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform-origin: center center;
            transition: transform 2s cubic-bezier(0.25, 1, 0.5, 1), opacity 1.5s ease;
        }

        .petals-outer { fill: #8e58a0; }
        .petals-inner { fill: #b878ce; }
        .flower-center { fill: #e5a92a; }

        .aster-container.blooming .petals-outer {
            transform: scale(3.5) rotate(90deg);
            opacity: 0;
        }

        .aster-container.blooming .petals-inner {
            transform: scale(4) rotate(-120deg);
            opacity: 0;
        }

        .aster-container.blooming .flower-center {
            transform: scale(5);
            opacity: 0;
        }

        .aster-container.blooming .aster-text {
            opacity: 0;
            transform: translateY(20px);
        }

        .aster-text {
            margin-top: 20px;
            color: #dcd3c6;
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
            font-style: italic;
        }

        /* Carta Estilo Livro Antigo / Machado de Assis */
        .carta {
            display: none;
            background: #f6f0e3;
            background-image: radial-gradient(#d8ccb8 1px, transparent 1px);
            background-size: 24px 24px;
            padding: 45px 35px;
            border: 2px solid #3c2e28;
            outline: 1px solid #b39b7d;
            outline-offset: -7px;
            border-radius: 4px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), inset 0 0 70px rgba(185, 160, 125, 0.35);
            width: 100%;
            min-height: 520px;
            position: relative;
            line-height: 1.9;
            font-size: 16.5px;
            text-align: justify;
            white-space: pre-wrap;
            opacity: 0;
            transform: scale(0.85);
            transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 1s ease, background-color 1.5s ease, border-color 1.5s ease;
        }

        .carta.revelada {
            opacity: 1;
            transform: scale(1);
        }

        /* Carta ao Aceitar */
        .carta.theme-romantic {
            background-color: #faf0f2;
            border-color: #632e3b;
            outline-color: #d4a3ad;
            box-shadow: 0 25px 60px rgba(45, 12, 20, 0.6), inset 0 0 70px rgba(212, 163, 173, 0.35);
        }

        h1 {
            text-align: center;
            font-size: 19px;
            font-weight: normal;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-bottom: 1px solid #b39b7d;
            padding-bottom: 15px;
            margin-bottom: 25px;
            color: #4a3528;
            transition: color 1.2s ease, border-color 1.2s ease;
        }

        .carta.theme-romantic h1 {
            color: #632e3b;
            border-bottom-color: #d4a3ad;
        }

        #texto {
            display: inline;
        }

        #cursor {
            border-left: 2px solid #8e2a2a;
            animation: piscar 0.7s infinite;
            margin-left: 2px;
            display: inline-block;
            height: 18px;
            vertical-align: middle;
        }

        @keyframes piscar {
            50% { opacity: 0; }
        }

        /* Cartão Final de Pedido */
        .question-card {
            display: none;
            margin-top: 35px;
            padding: 25px 20px;
            background: #ede6f5;
            border: 1px dashed #8e58a0;
            border-radius: 6px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            animation: fadeInUp 1s ease forwards;
            transition: background 1.2s ease, border-color 1.2s ease;
        }

        .question-card.theme-romantic {
            background: #f7e6eb;
            border-color: #c97185;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .question-title {
            font-size: 18px;
            font-style: italic;
            color: #3b2348;
            margin-bottom: 20px;
            transition: color 1.2s ease;
        }

        .question-card.theme-romantic .question-title {
            color: #632e3b;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-option {
            padding: 12px 24px;
            border: none;
            border-radius: 30px;
            font-family: 'Georgia', serif;
            font-size: 14px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .btn-yes {
            background: #6b3e7a;
            color: #fff;
            box-shadow: 0 4px 12px rgba(107, 62, 122, 0.35);
        }

        .btn-yes:hover {
            background: #542f61;
            transform: translateY(-2px);
        }

        .btn-no {
            background: #ded5c5;
            color: #4a3528;
        }

        .btn-no:hover {
            background: #d0c5b2;
        }

        .response-message {
            margin-top: 15px;
            font-size: 16px;
            color: #3b2348;
            font-style: italic;
            display: none;
            animation: fadeIn 0.8s ease forwards;
            line-height: 1.7;
        }

        .question-card.theme-romantic .response-message {
            color: #632e3b;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 480px) {
            .carta {
                padding: 30px 22px;
                font-size: 15px;
                line-height: 1.8;
            }
            h1 {
                font-size: 16px;
            }
            .question-title {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <!-- Flor Áster Interativa -->
        <div class="aster-container" id="asterBtn" onclick="desabrocharFlor()">
            <svg class="aster-flower" viewBox="0 0 100 100">
                <g class="petals-layer petals-outer">
                    <path d="M50 50 L47 5 A3 3 0 0 1 53 5 Z" transform="rotate(0 50 50)"/>
                    <path d="M50 50 L47 5 A3 3 0 0 1 53 5 Z" transform="rotate(15 50 50)"/>
                    <path d="M50 50 L47 5 A3 3 0 0 1 53 5 Z" transform="rotate(30 50 50)"/>
                    <path d="M50 50 L47 5 A3 3 0 0 1 53 5 Z" transform="rotate(45 50 50)"/>
                    <path d="M50 50 L47 5 A3 3 0 0 1 53 5 Z" transform="rotate(60 50 50)"/>
                    <path d="M50 50 L47 5 A3 3 0 0 1 53 5 Z" transform="rotate(75 50 50)"/>
                    <path d="M50 50 L47 5 A3 3 0 0 1 53 5 Z" transform="rotate(90 50 50)"/>
                    <path d="M50 50 L47 5 A3 3 0 0 1 53 5 Z" transform="rotate(105 50 50)"/>
                    <path d="M50 50 L47 5 A3 3 0 0 1 53 5 Z" transform="rotate(120 50 50)"/>
                    <path d="M50 50 L47 5 A3 3 0 0 1 53 5 Z" transform="rotate(135 50 50)"/>
                    <path d="M50 50 L47 5 A3 3 0 0 1 53 5 Z" transform="rotate(150 50 50)"/>
                    <path d="M50 50 L47 5 A3 3 0 0 1 53 5 Z" transform="rotate(165 50 50)"/>
                    <path d="M50 50 L47 5 A3 3 0 0 1 53 5 Z" transform="rotate(180 50 50)"/>
                    <path d="M50 50 L47 5 A3 3 0 0 1 53 5 Z" transform="rotate(195 50 50)"/>
                    <path d="M50 50 L47 5 A3 3 0 0 1 53 5 Z" transform="rotate(210 50 50)"/>
                    <path d="M50 50 L47 5 A3 3 0 0 1 53 5 Z" transform="rotate(225 50 50)"/>
                    <path d="M50 50 L47 5 A3 3 0 0 1 53 5 Z" transform="rotate(240 50 50)"/>
                    <path d="M50 50 L47 5 A3 3 0 0 1 53 5 Z" transform="rotate(255 50 50)"/>
                    <path d="M50 50 L47 5 A3 3 0 0 1 53 5 Z" transform="rotate(270 50 50)"/>
                    <path d="M50 50 L47 5 A3 3 0 0 1 53 5 Z" transform="rotate(285 50 50)"/>
                    <path d="M50 50 L47 5 A3 3 0 0 1 53 5 Z" transform="rotate(300 50 50)"/>
                    <path d="M50 50 L47 5 A3 3 0 0 1 53 5 Z" transform="rotate(315 50 50)"/>
                    <path d="M50 50 L47 5 A3 3 0 0 1 53 5 Z" transform="rotate(330 50 50)"/>
                    <path d="M50 50 L47 5 A3 3 0 0 1 53 5 Z" transform="rotate(345 50 50)"/>
                </g>
                <g class="petals-layer petals-inner">
                    <path d="M50 50 L48 12 A2 2 0 0 1 52 12 Z" transform="rotate(7.5 50 50)"/>
                    <path d="M50 50 L48 12 A2 2 0 0 1 52 12 Z" transform="rotate(37.5 50 50)"/>
                    <path d="M50 50 L48 12 A2 2 0 0 1 52 12 Z" transform="rotate(67.5 50 50)"/>
                    <path d="M50 50 L48 12 A2 2 0 0 1 52 12 Z" transform="rotate(97.5 50 50)"/>
                    <path d="M50 50 L48 12 A2 2 0 0 1 52 12 Z" transform="rotate(127.5 50 50)"/>
                    <path d="M50 50 L48 12 A2 2 0 0 1 52 12 Z" transform="rotate(157.5 50 50)"/>
                    <path d="M50 50 L48 12 A2 2 0 0 1 52 12 Z" transform="rotate(187.5 50 50)"/>
                    <path d="M50 50 L48 12 A2 2 0 0 1 52 12 Z" transform="rotate(217.5 50 50)"/>
                    <path d="M50 50 L48 12 A2 2 0 0 1 52 12 Z" transform="rotate(247.5 50 50)"/>
                    <path d="M50 50 L48 12 A2 2 0 0 1 52 12 Z" transform="rotate(277.5 50 50)"/>
                    <path d="M50 50 L48 12 A2 2 0 0 1 52 12 Z" transform="rotate(307.5 50 50)"/>
                    <path d="M50 50 L48 12 A2 2 0 0 1 52 12 Z" transform="rotate(337.5 50 50)"/>
                </g>
                <circle class="petals-layer flower-center" cx="50" cy="50" r="12" />
            </svg>
            <div class="aster-text">Tocar na Áster</div>
        </div>

        <!-- Conteúdo da Carta -->
        <div class="carta" id="carta">
            <h1 id="titulo"></h1>
            <div id="texto"></div><span id="cursor" style="display: none;"></span>

            <!-- Bloco de Pedido de Namoro -->
            <div class="question-card" id="questionCard">
                <div class="question-title">Minha Princesa, aceita ser minha namorada e escrever essa história ao meu lado?</div>
                <div class="btn-group" id="btnGroup">
                    <button class="btn-option btn-yes" onclick="responder('sim')">Sim, meu Príncipe! 👑✨</button>
                    <button class="btn-option btn-no" onclick="responder('nao')">Ainda preciso de tempo 😊</button>
                </div>
                <div class="response-message" id="responseMessage"></div>
            </div>
        </div>
    </div>

    <script>
        const tituloElemento = document.getElementById('titulo');
        const textoElemento = document.getElementById('texto');
        const cursor = document.getElementById('cursor');
        const asterBtn = document.getElementById('asterBtn');
        const carta = document.getElementById('carta');
        const questionCard = document.getElementById('questionCard');
        const btnGroup = document.getElementById('btnGroup');
        const responseMessage = document.getElementById('responseMessage');
        
        const dataH1 = "Capítulo Único: A Estrela e o Tempo";
        
        // Texto Machadiano Rebuscado e Pessoal
        const mensagem = `Minha cara Esther,

Se o velho Machado de Assis aqui estivesse, diria que o tempo é um tecelão caprichoso e que os afetos sinceros desafiam a lógica dos homens. Você me alertara, com a doçura que lhe é própria, de que os caminhos poderiam ser árduos e que eu não precisaria assumir tal desafio. Ocorre que esqueceram de avisar ao meu coração que onde reside o seu sorriso, a dificuldade se dissolve em vontade.

Lembrei-me das estrelas do persa e da flor áster que desceu à terra. Se o firmamento perdeu seu astro mais bonito para que você nascesse, quem seria eu para não aceitar o honroso privilégio de ser o seu Príncipe?

Não há pressa, nem rédea curta naquilo que é nobre. Eu respeito o seu tempo, o seu silêncio e cada espaço da sua alma. Mas não posso negar o óbvio: a vida ganha contornos de poesia quando é vivida ao seu lado.

Portanto, esta não é uma mera mensagem, mas sim um pacto de afeto, leveza e admiração sincera.

Com todo o meu carinho,
Do seu eterno Príncipe.`;

        let i = 0;
        let j = 0;

        // Criar pontos de iluminação no fundo
        for (let k = 0; k < 20; k++) {
            let sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.style.left = Math.random() * 100 + 'vw';
            sparkle.style.top = Math.random() * 100 + 'vh';
            sparkle.style.animationDelay = (Math.random() * 5) + 's';
            document.body.appendChild(sparkle);
        }

        function desabrocharFlor() {
            asterBtn.classList.add('blooming');
            
            setTimeout(() => {
                asterBtn.style.display = 'none';
                carta.style.display = 'block';
                
                setTimeout(() => {
                    carta.classList.add('revelada');
                    cursor.style.display = 'inline-block';
                    digitarTitulo();
                }, 50);
            }, 800);
        }

        function digitarTitulo() {
            if (i < dataH1.length) {
                tituloElemento.textContent += dataH1.charAt(i);
                i++;
                setTimeout(digitarTitulo, 100);
            } else {
                setTimeout(digitarTexto, 400);
            }
        }

        function digitarTexto() {
            if (j < mensagem.length) {
                textoElemento.textContent += mensagem.charAt(j);
                j++;
                window.scrollTo(0, document.body.scrollHeight);
                setTimeout(digitarTexto, 70); // Velocidade de leitura confortável
            } else {
                cursor.style.display = 'none';
                setTimeout(() => {
                    questionCard.style.display = 'block';
                    window.scrollTo(0, document.body.scrollHeight);
                }, 800);
            }
        }

        function responder(opcao) {
            btnGroup.style.display = 'none';
            responseMessage.style.display = 'block';

            if (opcao === 'sim') {
                document.body.classList.add('theme-romantic');
                carta.classList.add('theme-romantic');
                questionCard.classList.add('theme-romantic');

                responseMessage.innerHTML = "A partir de hoje, escrevemos o nosso próprio livro. Prometo honrar cada capítulo ao seu lado, minha Princess! 👑🤍✨";
            } else {
                responseMessage.innerHTML = "O tempo é o nosso melhor aliado. Continuarei aqui, no seu ritmo e admirando a pessoa incrível que você é. 😊";
            }
        }
    </script>

</body>
</html>
