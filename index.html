<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>No Seu Ritmo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: #dcd3c6;
            font-family: 'Playfair Display', 'Georgia', serif;
            color: #2c241b;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px 12px;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at center, rgba(255, 255, 255, 0.25) 0%, rgba(0, 0, 0, 0.08) 100%),
                repeating-linear-gradient(45deg, rgba(0,0,0,0.01) 0px, rgba(0,0,0,0.01) 2px, transparent 2px, transparent 4px);
            pointer-events: none;
            z-index: 0;
        }

        .carta-container {
            position: relative;
            z-index: 1;
            width: 94%;
            max-width: 580px;
            background-color: #fdfbf7;
            padding: 26px 20px;
            border: 1px solid #c8bba6;
            border-radius: 6px;
            box-shadow: 
                0 10px 30px rgba(44, 36, 27, 0.15),
                0 1px 4px rgba(0, 0, 0, 0.05),
                inset 0 0 80px rgba(210, 190, 165, 0.2);
            line-height: 1.85;
            font-size: 17px;
            text-align: justify;
            word-wrap: break-word;
            overflow-wrap: break-word;
            transition: all 0.3s ease;
        }

        @media (min-width: 600px) {
            .carta-container {
                width: 92%;
                padding: 40px 35px;
                font-size: 18.5px;
            }
        }

        h1 {
            font-family: 'Cinzel', 'Georgia', serif;
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #4a3b2c;
            border-bottom: 1px dashed #c8bba6;
            padding-bottom: 14px;
            margin-bottom: 24px;
            min-height: 38px;
        }

        @media (min-width: 600px) {
            h1 {
                font-size: 23px;
                letter-spacing: 3px;
            }
        }

        .texto-conteudo {
            white-space: pre-wrap;
            display: inline;
        }

        #cursor {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background-color: #9d2e1c;
            margin-left: 3px;
            vertical-align: middle;
            animation: piscar 0.7s infinite;
        }

        @keyframes piscar {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .cursor-hidden {
            display: none !important;
        }

        .acoes {
            margin-top: 32px;
            display: flex;
            justify-content: center;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.6s ease, transform 0.6s ease;
            pointer-events: none;
        }

        .acoes.visivel {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .btn-reiniciar {
            font-family: 'Cinzel', serif;
            background: transparent;
            color: #6a5340;
            border: 1px solid #a89a85;
            padding: 10px 22px;
            font-size: 13px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.04);
        }

        .btn-reiniciar:hover, .btn-reiniciar:active {
            background-color: #f2ebe0;
            color: #2c241b;
            border-color: #8c7b66;
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.08);
        }

        .stamp-mark {
            position: absolute;
            bottom: 12px;
            right: 16px;
            font-size: 11px;
            color: #b5a794;
            font-family: sans-serif;
            letter-spacing: 1px;
            pointer-events: none;
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <div class="carta-container" id="carta">
        <h1 id="titulo"></h1>
        <div id="texto" class="texto-conteudo"></div><span id="cursor"></span>

        <div class="acoes" id="acoesContainer">
            <button class="btn-reiniciar" id="btnReiniciar" onclick="reiniciarAnimacao()">
                <span style="margin-right: 6px;">↺</span> Ler Novamente
            </button>
        </div>

        <div class="stamp-mark">❖ M.L.</div>
    </div>

    <script>
        const tituloElemento = document.getElementById('titulo');
        const textoElemento = document.getElementById('texto');
        const cursorElemento = document.getElementById('cursor');
        const acoesContainer = document.getElementById('acoesContainer');
        const cartaContainer = document.getElementById('carta');
        
        const dataH1 = "No Seu Ritmo";
        const mensagem = `Minha cara,

Fiz esta pequena página apenas para lhe tirar um sorriso e deixar registrado o quanto a sua presença é especial para mim.

Quero que saiba que não há pressa, nem qualquer tipo de cobrança. Eu admiro muito a sua essência, o seu jeito e o carinho que compartilhamos. Por isso mesmo, faço questão de respeitar o seu tempo, o seu espaço e os seus pensamentos.

A possibilidade de darmos um passo a mais me deixa muito feliz, mas a minha prioridade sempre será ver você bem, leve e confortável com tudo.

Apenas leia isso como um gesto carinhoso de quem gosta muito de você e torce, sem pressa, por cada momento nosso.

Com todo o carinho e respeito,
Adriano Leite`;

        let indexTitulo = 0;
        let indexTexto = 0;
        let timeoutId = null;

        function digitarTitulo() {
            if (indexTitulo < dataH1.length) {
                tituloElemento.textContent += dataH1.charAt(indexTitulo);
                indexTitulo++;
                timeoutId = setTimeout(digitarTitulo, 90);
            } else {
                timeoutId = setTimeout(digitarTexto, 450);
            }
        }

        function digitarTexto() {
            if (indexTexto < mensagem.length) {
                textoElemento.textContent += mensagem.charAt(indexTexto);
                indexTexto++;

                // Auto scroll smoothly on mobile screens if text expands past view
                const cartaRect = cartaContainer.getBoundingClientRect();
                if (cartaRect.bottom > window.innerHeight - 30) {
                    window.scrollBy({
                        top: 25,
                        behavior: 'smooth'
                    });
                }

                // Natural, gentle typing cadence
                const speed = Math.random() * 20 + 35;
                timeoutId = setTimeout(digitarTexto, speed);
            } else {
                // Reveal action button when typing finishes
                setTimeout(() => {
                    cursorElemento.classList.add('cursor-hidden');
                    acoesContainer.classList.add('visivel');
                }, 600);
            }
        }

        function reiniciarAnimacao() {
            clearTimeout(timeoutId);
            acoesContainer.classList.remove('visivel');
            cursorElemento.classList.remove('cursor-hidden');
            
            tituloElemento.textContent = '';
            textoElemento.textContent = '';
            indexTitulo = 0;
            indexTexto = 0;

            window.scrollTo({ top: 0, behavior: 'smooth' });

            setTimeout(digitarTitulo, 300);
        }

        window.onload = () => {
            setTimeout(digitarTitulo, 400);
        };
    </script>

</body>
</html>
