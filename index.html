<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uma missiva de outrora</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #dcd3c6; 
            font-family: 'Georgia', serif;
            color: #2c241b; 
            padding: 20px;
            box-sizing: border-box;
        }

        .carta {
            background-color: #f8f4eb; 
            padding: 40px; 
            border: 1px solid #c8bba6;
            box-shadow: 10px 15px 35px rgba(44, 36, 27, 0.2);
            width: 100%;
            max-width: 600px;
            min-height: 500px;
            position: relative;
            line-height: 1.8;
            font-size: 18px;
            text-align: justify;
            white-space: pre-wrap; /* Mantém as quebras de linha */
        }

        h1 {
            text-align: center;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 1px dashed #c8bba6;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }

        #cursor {
            border-left: 2px solid #9d2e1c;
            animation: piscar 0.7s infinite;
            margin-left: 2px;
        }

        @keyframes piscar {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="carta">
        <h1 id="titulo"></h1>
        <div id="texto"></div><span id="cursor"></span>
    </div>

    <script>
        const tituloElemento = document.getElementById('titulo');
        const textoElemento = document.getElementById('texto');
        
        const dataH1 = "Uma Nota sobre Olhares";
        const mensagem = `Minha cara,

Tenho notado a frequência com que nossos olhares se cruzam — e, confesso, o modo curioso com que os seus demoram-se nos meus.

Se a física diz que a gravidade atrai os corpos, a intuição me sugere que há algo de sutilmente inevitável na forma como você me observa. Não sou homem de ignorar bons presságios, tampouco de deixar sem resposta uma provocação tão elegante.

Se esse seu olhar guarda uma intenção, que tal deixarmos as entrelinhas de lado e descobrirmos o que acontece no próximo capítulo? 

Um café, uma boa conversa e tempo suficiente para ver se os seus olhos confirmam o que o seu silêncio tem ensaiado.

À sua espera,
Adriano Leite`;

        let i = 0;
        let j = 0;

        function digitarTitulo() {
            if (i < dataH1.length) {
                tituloElemento.textContent += dataH1.charAt(i);
                i++;
                setTimeout(digitarTitulo, 100);
            } else {
                setTimeout(digitarTexto, 500);
            }
        }

        function digitarTexto() {
            if (j < mensagem.length) {
                textoElemento.textContent += mensagem.charAt(j);
                j++;
                // Rola a tela para baixo automaticamente se o texto crescer
                window.scrollTo(0, document.body.scrollHeight);
                setTimeout(digitarTexto, 40); // Velocidade da digitação
            } else {
                document.getElementById('cursor').style.display = 'none';
            }
        }

        // Inicia a animação
        window.onload = digitarTitulo;
    </script>

</body>
